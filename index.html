<!DOCTYPE html>
<html lang="es" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitForm | Strong Pilates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,800;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Montserrat', 'sans-serif'],
            },
            colors: {
              // Exact matches from Brandbook
              fitform: {
                bone: '#F5F2EE',
                stone: '#D1CDC7',
                greige: '#BDB7AF',
                navy: '#1A2232',
                teal: '#244D4D',
                shadow: '#2C3E50',
                obsidian: '#0B0F15',
                charcoal: '#262626',
                slate: '#2F353B',
              },
              // Mapping standard Tailwind 'stone' to Brand colors for seamless integration
              stone: {
                50: '#F5F2EE',  // Warm Bone
                100: '#EBE8E4',
                200: '#D1CDC7', // Stone
                300: '#BDB7AF', // Soft Greige
                400: '#9ca3af',
                500: '#78716c',
                600: '#57534e',
                700: '#44403c',
                800: '#1A2232', // Fitform Navy
                900: '#151A25',
                950: '#0B0F15', // Fitform Obsidian
              }
            },
            animation: {
              'blob': 'blob 10s infinite',
              'fade-up': 'fadeUp 0.8s ease-out forwards',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Smooth Scrolling & Premium Scrollbar matching Brandbook */
      html {
        scroll-behavior: smooth;
        transition: background-color 0.5s ease, color 0.5s ease;
        background-color: #0B0F15; /* Obsidian default */
      }
      ::-webkit-scrollbar {
        width: 8px;
        background: #0B0F15;
      }
      ::-webkit-scrollbar-thumb {
        background: #244D4D; /* Sculpt Teal */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-track {
        background: #1A2232; /* Navy */
      }
      
      /* Noise Texture Overlay */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        mix-blend-mode: overlay;
      }

      /* Liquid Glass Aesthetics from Brandbook */
      .glass-panel {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(28, 25, 23, 0.05); 
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        transition: all 0.5s ease;
      }

      .glass-panel-dark {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(28, 25, 23, 0.05);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        transition: all 0.5s ease;
      }

      /* Dark Mode Liquid Glass - Matches Brandbook Layering */
      .dark .glass-panel {
        background: rgba(26, 34, 50, 0.4); /* Navy with opacity */
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      }
      
      .dark .glass-panel-dark {
        background: rgba(11, 15, 21, 0.7); /* Obsidian with opacity */
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@0.344.0",
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?deps=react@18.2.0,react-dom@18.2.0"
  }
}
</script>
</head>
  <body class="bg-fitform-bone dark:bg-fitform-obsidian text-stone-900 dark:text-stone-50 antialiased selection:bg-fitform-teal selection:text-white overflow-x-hidden transition-colors duration-700">
    <div class="bg-noise"></div>
    <div id="root" class="relative z-10"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
